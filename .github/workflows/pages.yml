name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add movie artwork
        run: |
          mkdir -p portfolio/assets
          cp media/movie_images/avatar.jpg portfolio/assets/avatar.jpg
          cp media/movie_images/inception.jpg portfolio/assets/inception.jpg
          cp media/movie_images/titanic.jpg portfolio/assets/titanic.jpg
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
